server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite adds a hash to each file name in assets/. Cache these files for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Send unknown paths to index.html for client-side routes.
  location / {
    try_files $uri /index.html;
  }
}

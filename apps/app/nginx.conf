server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text files.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The add_header lines in a location block replace the ones from the server block.
  # So each location block that has an add_header line must repeat the security headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Vite adds a hash to each file name in assets/. Cache these files for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Send unknown paths to index.html for client-side routes.
  location / {
    try_files $uri /index.html;
  }
}

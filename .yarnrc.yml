approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

# TypeScript 7 has no JavaScript API. The generator @hey-api/openapi-ts
# needs that API. This gives the generator a TypeScript 6 copy with a
# different name. scripts/typescript-6-hooks.mjs sends its imports there.
packageExtensions:
  "@hey-api/openapi-ts@*":
    dependencies:
      typescript-6: npm:typescript@6.0.3

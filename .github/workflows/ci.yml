name: CI

# Pull requests run the checks. A pull request must pass before merge.
on:
  pull_request:
  push:
    branches: [main]

# Cancel an old run when you push a new commit to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Corepack must run before setup-node, so that the yarn cache works.
      - name: Enable Corepack
        run: corepack enable

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable
      - run: yarn fmt:check
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

      # Keep the built site for the deploy job. Only a push to main needs it.
      # actions/upload-artifact v7.0.2
      - name: Upload site build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Build image, push to GHCR, deploy to Dokploy
    needs: check
    # Run only after a merge to main. A pull request never deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/download-artifact v8.0.2
      - name: Download site build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist

      # docker/setup-buildx-action v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/login-action v4.8.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/build-push-action v7.4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell Dokploy to pull the new image and restart the app.
      - name: Trigger Dokploy deploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
